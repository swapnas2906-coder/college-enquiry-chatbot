<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JIT Davangere Chatbot</title>
<style>
  :root { --blue:#1e3a9e; --orange:#e8832a; --bg:#f1f3f8; --ink:#1b1f2a; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family:"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }
  header { background:var(--blue); color:#fff; padding:14px 20px; border-bottom:4px solid var(--orange); display:flex; align-items:center; gap:12px; }
  header .t { flex:1; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:2px 0 0; font-size:13px; opacity:.85; }
  .hbtn { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.6); border-radius:8px; padding:7px 12px; cursor:pointer; font-size:13px; }
  .hbtn:hover { background:rgba(255,255,255,.15); }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:14px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
  .bot { background:#fff; align-self:flex-start; border:1px solid #e1e5ee; }
  .user { background:var(--blue); color:#fff; align-self:flex-end; }
  .typing { display:flex; gap:5px; padding:14px; }
  .typing i { width:8px; height:8px; border-radius:50%; background:#9aa3b8; animation:b 1s infinite; }
  .typing i:nth-child(2){ animation-delay:.15s } .typing i:nth-child(3){ animation-delay:.3s }
  @keyframes b { 0%,60%,100%{ transform:translateY(0); opacity:.5 } 30%{ transform:translateY(-5px); opacity:1 } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation:none } }
  #chips { display:flex; gap:8px; padding:8px 16px; overflow-x:auto; }
  .chip { white-space:nowrap; background:#fff; border:1px solid var(--blue); color:var(--blue); border-radius:20px; padding:7px 14px; cursor:pointer; font-size:14px; }
  .chip:hover { background:var(--blue); color:#fff; }
  .chip.alt { border-color:var(--orange); color:#b85d10; }
  .chip.alt:hover { background:var(--orange); color:#fff; }
  #bar { display:flex; gap:8px; padding:10px 16px 14px; background:var(--bg); align-items:center; }
  #q { flex:1; padding:12px 14px; border:1px solid #c7cddc; border-radius:10px; font-size:15px; }
  #bar select { padding:11px 6px; border:1px solid #c7cddc; border-radius:10px; background:#fff; }
  .btn { background:var(--orange); color:#fff; border:0; border-radius:10px; padding:12px 18px; font-weight:600; cursor:pointer; font-size:15px; }
  .btn:hover { filter:brightness(.95); }
  #mic { background:#fff; color:var(--blue); border:1px solid #c7cddc; padding:11px 13px; }
  #mic.on { background:#d92d20; color:#fff; border-color:#d92d20; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid #7aa2ff; outline-offset:1px; }
  .modal { position:fixed; inset:0; background:rgba(15,20,40,.55); display:none; align-items:center; justify-content:center; padding:16px; }
  .modal.open { display:flex; }
  .card { background:#fff; border-radius:14px; padding:20px; width:100%; max-width:400px; }
  .card h2 { margin:0 0 12px; font-size:18px; color:var(--blue); }
  .card label { display:block; font-size:13px; margin:10px 0 4px; }
  .card input, .card select { width:100%; padding:10px; border:1px solid #c7cddc; border-radius:8px; font-size:15px; }
  .row { display:flex; gap:8px; margin-top:16px; }
  .row .btn { flex:1; } .btn.grey { background:#e4e7ef; color:#333; }
  .total { margin-top:14px; padding:12px; background:#eef2ff; border-radius:10px; font-size:15px; }
  .total b { font-size:20px; color:var(--blue); }
  .err { color:#c0270f; font-size:13px; margin-top:8px; min-height:16px; }
  .chk { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:14px; }
  .chk input { width:auto; }
</style>
</head>
<body>
<header>
  <div class="t">
    <h1>JIT Davangere Enquiry Bot</h1>
    <p>Ask about fees, courses, hostel and more / ಶುಲ್ಕ, ಕೋರ್ಸ್, ಹಾಸ್ಟೆಲ್ ಬಗ್ಗೆ ಕೇಳಿ</p>
  </div>
  <button class="hbtn" id="newChat">New chat</button>
  <a class="hbtn" href="/logout" style="text-decoration:none">Logout</a>
</header>

<div id="chat" aria-live="polite"></div>

<div id="chips">
  <button class="chip" data-q="Tell me about the fees for all courses">Fees</button>
  <button class="chip" data-q="Which courses are available?">Courses</button>
  <button class="chip" data-q="Tell me about hostel fees and facilities">Hostel</button>
  <button class="chip" data-q="Tell me about placements">Placements</button>
  <button class="chip" data-q="What is the admission process, eligibility and last date?">Admission</button>
  <button class="chip" data-q="What scholarships are available?">Scholarships</button>
  <button class="chip" data-q="Give me the contact details of the college">Contact</button>
  <button class="chip alt" id="openCalc">Fee calculator</button>
  <button class="chip alt" id="openForm">Enquiry form</button>
</div>

<div id="bar">
  <input id="q" type="text" placeholder="Ask something... / ಏನಾದರೂ ಕೇಳಿ..." autocomplete="off" maxlength="500">
  <select id="lang" title="Voice language"><option value="en-IN">EN</option><option value="kn-IN">ಕನ್ನಡ</option></select>
  <button class="btn" id="mic" title="Speak" aria-label="Speak">🎤</button>
  <button class="btn" id="send">Send</button>
</div>

<!-- Fee calculator -->
<div class="modal" id="calcModal"><div class="card">
  <h2>Fee calculator</h2>
  <label for="cCourse">Course</label><select id="cCourse"></select>
  <label class="chk"><input type="checkbox" id="cBus"> College bus</label>
  <label for="cHostel">Hostel</label>
  <select id="cHostel"><option value="none">No hostel</option><option value="boys">Boys hostel</option><option value="girls">Girls hostel</option></select>
  <div class="total" id="cTotal"></div>
  <div class="row"><button class="btn grey" data-close>Close</button></div>
</div></div>

<!-- Enquiry form -->
<div class="modal" id="formModal"><div class="card">
  <h2>Enquiry form</h2>
  <label for="fName">Your name</label><input id="fName" maxlength="80">
  <label for="fPhone">Mobile number</label><input id="fPhone" inputmode="numeric" maxlength="10" placeholder="10 digits">
  <label for="fCourse">Course you are interested in</label>
  <select id="fCourse"><option>CSE</option><option>ISE</option><option>ECE</option><option>Mechanical</option><option>Civil</option><option>M.Tech</option><option>MBA</option></select>
  <div class="err" id="fErr"></div>
  <div class="row"><button class="btn grey" data-close>Cancel</button><button class="btn" id="fSend">Submit</button></div>
</div></div>

<script>
const chat = document.getElementById("chat"), q = document.getElementById("q");
const sendBtn = document.getElementById("send");
let busy = false, FEES = null;

// Simple, safe markdown: **bold**, *italic*, "* item" / "- item" bullets
function md(s) {
  s = s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return s
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|\n)\s*[*-] /g, "$1• ")
    .replace(/\*(.+?)\*/g, "<i>$1</i>");
}
function add(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who;
  if (who === "bot") d.innerHTML = md(text); else d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
function greet() {
  add("Hi! I'm the JIT Davangere assistant. Ask me about fees, courses, hostel or anything about studies. You can type in English or Kannada, or use the 🎤 button.", "bot");
}
function typing() {
  const d = document.createElement("div");
  d.className = "msg bot typing"; d.innerHTML = "<i></i><i></i><i></i>";
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
async function ask(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true; q.value = "";
  add(text, "user");
  const t = typing();
  try {
    const r = await fetch("/chat", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ message:text }) });
    const j = await r.json();
    t.remove(); add(j.reply, "bot");
  } catch (e) {
    t.remove(); add("Connection problem. Please try again.", "bot");
  }
  busy = false; sendBtn.disabled = false; q.focus();
}
sendBtn.onclick = () => ask(q.value);
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) ask(q.value); });
document.querySelectorAll(".chip[data-q]").forEach(b => b.onclick = () => ask(b.dataset.q));

// New chat
document.getElementById("newChat").onclick = async () => {
  await fetch("/reset", { method:"POST" });
  chat.innerHTML = ""; greet();
};

// Modals
function openModal(id) { document.getElementById(id).classList.add("open"); }
function closeAll() { document.querySelectorAll(".modal").forEach(m => m.classList.remove("open")); }
document.querySelectorAll("[data-close]").forEach(b => b.onclick = closeAll);
document.querySelectorAll(".modal").forEach(m => m.addEventListener("click", e => { if (e.target === m) closeAll(); }));
document.addEventListener("keydown", e => { if (e.key === "Escape") closeAll(); });

// Fee calculator
const inr = n => "Rs. " + Number(n).toLocaleString("en-IN");
function calc() {
  if (!FEES) return;
  const c = FEES.courses[document.getElementById("cCourse").value] || 0;
  const h = document.getElementById("cHostel").value;
  const hostel = h === "boys" ? FEES.boys_hostel : h === "girls" ? FEES.girls_hostel : 0;
  const bus = document.getElementById("cBus").checked ? FEES.bus : 0;
  const total = c + FEES.exam + hostel + bus;
  document.getElementById("cTotal").innerHTML =
    `Tuition: ${inr(c)}<br>Exam fee: ${inr(FEES.exam)}<br>Hostel: ${inr(hostel)}<br>Bus: ${inr(bus)}<br><br>Total per year: <b>${inr(total)}</b>`;
}
document.getElementById("openCalc").onclick = async () => {
  if (!FEES) {
    try { FEES = await (await fetch("/fees")).json(); } catch (e) { add("Could not load fees. Please try again.", "bot"); return; }
    const sel = document.getElementById("cCourse");
    Object.keys(FEES.courses).forEach(k => { const o = document.createElement("option"); o.textContent = k; sel.appendChild(o); });
  }
  calc(); openModal("calcModal");
};
["cCourse","cHostel","cBus"].forEach(id => document.getElementById(id).addEventListener("change", calc));

// Enquiry form
document.getElementById("openForm").onclick = () => { document.getElementById("fErr").textContent = ""; openModal("formModal"); };
document.getElementById("fSend").onclick = async () => {
  const err = document.getElementById("fErr");
  const body = { name:document.getElementById("fName").value, phone:document.getElementById("fPhone").value, course:document.getElementById("fCourse").value };
  try {
    const j = await (await fetch("/enquiry", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) })).json();
    if (!j.ok) { err.textContent = j.error; return; }
    closeAll();
    document.getElementById("fName").value = ""; document.getElementById("fPhone").value = "";
    add("Thank you! Your details are saved. The college office will contact you soon.", "bot");
  } catch (e) { err.textContent = "Could not submit. Please try again."; }
};

// Voice input
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = document.getElementById("mic");
if (!SR) { mic.style.display = "none"; document.getElementById("lang").style.display = "none"; }
else {
  let rec = null;
  mic.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = document.getElementById("lang").value; rec.interimResults = false;
    rec.onstart = () => mic.classList.add("on");
    rec.onresult = e => { q.value = e.results[0][0].transcript; ask(q.value); };
    rec.onerror = () => add("Could not hear you. Please try again or type your question.", "bot");
    rec.onend = () => { mic.classList.remove("on"); rec = null; };
    rec.start();
  };
}

greet();
</script>
</body>
</html>
